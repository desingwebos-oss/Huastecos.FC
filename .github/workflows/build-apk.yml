name: Build APK Huastecos FC
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: huastecos-apk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: huastecos-apk/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HuastecosFC.apk
          gh release delete apk-latest --cleanup-tag --yes -R ${{ github.repository }} || true
          gh release create apk-latest HuastecosFC.apk -R ${{ github.repository }} \
            --title "Huastecos FC (Android)" \
            --notes "APK de Huastecos FC. Descarga HuastecosFC.apk e instálalo."
